{% extends "base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<style>
    /* Estilos Específicos para el Selector de Rango */
    .range-container {
        position: relative;
        padding-left: 15px;
        margin: 20px 0;
        user-select: none;
        touch-action: none;
    }

    .topic-list {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 2px solid #e9ecef;
    }

    .topic-item {
        padding: 12px 15px;
        margin-bottom: 2px;
        transition: background-color 0.2s ease;
        border-radius: 0 4px 4px 0;
        cursor: pointer;
    }

    .topic-item.h1-level { font-weight: bold; font-size: 1.1rem; color: #2c3e50; }
    .topic-item.h2-level { padding-left: 30px; font-size: 0.95rem; color: #555; }
    .topic-item.h3-level { padding-left: 50px; font-size: 0.85rem; color: #777; }

    /* Estado Seleccionado */
    .topic-item.in-range {
        background-color: #e3f2fd;
        border-left: 4px solid #2196f3;
        margin-left: -2px;
    }

    /* Estado No Seleccionable */
    .topic-item.unselectable {
        color: #adb5bd !important;
        cursor: default;
        font-style: italic;
    }

    /* Las Barras (Draggers) */
    .drag-bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 24px;
        background-color: #0d6efd;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: ns-resize;
        z-index: 10;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        border-radius: 12px;
        width: 100%;
        margin-top: -12px;
    }

    .drag-bar:active { background-color: #0a58ca; cursor: grabbing; }
    .drag-bar i { font-size: 12px; pointer-events: none; }
</style>

<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0">
                <div class="card-header bg-white py-3 border-bottom">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 text-primary">
                            <i class="fas fa-tasks me-2"></i>Configurar Autoevaluación
                        </h4>
                        <a href="{% url 'study_room:edit_copy' pk=user_copy.pk %}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-times me-1"></i>Cancelar
                        </a>
                    </div>
                </div>
                
                <div class="card-body p-4">
                    <div class="alert alert-info mb-4 text-center">
                        <i class="fas fa-arrows-alt-v me-2"></i>
                        Arrastra las barras azules para definir el <strong>Inicio</strong> y el <strong>Fin</strong> del temario a evaluar.
                    </div>

                    <form action="{% url 'assessment:generate_ai_assessment' copy_pk=user_copy.pk %}" method="POST" id="configForm">
                        {% csrf_token %}
                        <input type="hidden" name="selection_payload" id="selectionPayload">

                        <div class="range-container" id="rangeContainer">
                            <ul class="topic-list" id="topicList"></ul>

                            <div class="drag-bar" id="startBar" style="top: 0;">
                                <i class="fas fa-chevron-down"></i>
                            </div>

                            <div class="drag-bar" id="endBar" style="top: 100%;">
                                <i class="fas fa-chevron-up"></i>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-robot me-2"></i>Generar Examen Personalizado
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const topics = {{ flat_structure|safe }};
    const listEl = document.getElementById('topicList');
    const startBar = document.getElementById('startBar');
    const endBar = document.getElementById('endBar');
    const container = document.getElementById('rangeContainer');
    const payloadInput = document.getElementById('selectionPayload');

    let startIndex = 0;
    let endIndex = topics.length - 1;
    let minSelectableIndex = 0; // Nuevo límite inferior
    let itemHeight = 0;

    // 0. Calcular Límite Inferior (Ignorar Título y TOC)
    function calculateLimits() {
        for (let i = 0; i < topics.length; i++) {
            const text = topics[i].text.toLowerCase();
            // Criterios de exclusión: Índice 0 siempre fuera, o texto específico
            if (i === 0 || text.includes('tabla de contenidos') || text.includes('índice') || text.includes('table of contents')) {
                minSelectableIndex = i + 1;
            } else {
                // En cuanto encontramos uno válido, paramos
                break;
            }
        }
        // Seguridad: si todo está excluido (raro), resetear a 0
        if (minSelectableIndex >= topics.length) minSelectableIndex = 0;
        
        // Ajustar startIndex inicial
        startIndex = minSelectableIndex;
    }

    // 1. Renderizar Lista
    function renderList() {
        listEl.innerHTML = '';
        topics.forEach((topic, index) => {
            const li = document.createElement('li');
            let levelClass = 'h1-level';
            if (topic.level === 2) levelClass = 'h2-level';
            if (topic.level === 3) levelClass = 'h3-level';
            
            li.className = `topic-item ${levelClass}`;
            li.innerText = topic.text;
            li.dataset.index = index;

            // Marcar visualmente no seleccionables
            if (index < minSelectableIndex) {
                li.classList.add('unselectable');
            } else {
                li.onclick = () => snapToClick(index);
            }
            
            listEl.appendChild(li);
        });
        
        setTimeout(() => {
            const firstItem = listEl.querySelector('.topic-item');
            if (firstItem) itemHeight = firstItem.offsetHeight + 2;
            updateVisuals();
        }, 50);
    }

    // 2. Actualizar Posiciones y Estilos
    function updateVisuals() {
        const items = listEl.querySelectorAll('.topic-item');
        if (items.length === 0) return;

        const startItem = items[startIndex];
        const endItem = items[endIndex];

        startBar.style.top = `${startItem.offsetTop}px`;
        endBar.style.top = `${endItem.offsetTop + endItem.offsetHeight}px`;

        items.forEach((item, idx) => {
            if (idx >= startIndex && idx <= endIndex) {
                item.classList.add('in-range');
            } else {
                item.classList.remove('in-range');
            }
        });

        updatePayload();
    }

    function updatePayload() {
        const selectedIds = [];
        for (let i = startIndex; i <= endIndex; i++) {
            selectedIds.push(topics[i].id);
        }
        payloadInput.value = JSON.stringify(selectedIds);
    }

    // 3. Lógica de Arrastre
    let isDragging = null;

    function handleDragStart(e, type) {
        isDragging = type;
        e.preventDefault();
        document.body.style.cursor = 'grabbing';
    }

    function handleDragMove(e) {
        if (!isDragging) return;
        e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        // Buscamos el elemento exacto bajo el dedo/ratón
        const elementUnderCursor = document.elementFromPoint(clientX, clientY);
        const item = elementUnderCursor ? elementUnderCursor.closest('.topic-item') : null;
        
        if (!item) return;
        
        let tempIndex = parseInt(item.dataset.index);
        
        // Bloqueo de seguridad: No tocar zonas excluidas (Título/TOC)
        if (tempIndex < minSelectableIndex) tempIndex = minSelectableIndex;

        if (isDragging === 'start') {
            // La barra superior no puede bajar más allá de la inferior
            if (tempIndex >= endIndex) tempIndex = endIndex;
            startIndex = tempIndex;
        } else {
            // La barra inferior no puede subir más allá de la superior
            if (tempIndex <= startIndex) tempIndex = startIndex;
            endIndex = tempIndex;
        }

        updateVisuals();
    }

    function handleDragEnd() {
        isDragging = null;
        document.body.style.cursor = 'default';
    }

    startBar.addEventListener('mousedown', (e) => handleDragStart(e, 'start'));
    startBar.addEventListener('touchstart', (e) => handleDragStart(e, 'start'));
    endBar.addEventListener('mousedown', (e) => handleDragStart(e, 'end'));
    endBar.addEventListener('touchstart', (e) => handleDragStart(e, 'end'));
    document.addEventListener('mousemove', handleDragMove);
    document.addEventListener('touchmove', handleDragMove, { passive: false });
    document.addEventListener('mouseup', handleDragEnd);
    document.addEventListener('touchend', handleDragEnd);

    // Inicialización
    calculateLimits();
    renderList();
</script>
{% endblock %}

name: Deploy CampuStudiOnline to PythonAnywhere

# Despliegue automatico completo, creado 2026-07-24 en el marco de la
# migracion de CampuStudiOnline al flujo NFS (edicion directa contra
# GitHub), replicando el patron ya probado de EnterpriseBot. Se
# dispara en cada push a main. Hace, en este orden: git pull en el
# servidor via SSH, migrate --noinput, collectstatic --noinput
# --clear, reload de la web app via API de PythonAnywhere, y reinicio
# CONDICIONAL de las dos Always-on Tasks reales de CampuStudiOnline
# (Primario id 182748, Pesado id 209547) segun el diff del push --
# ver el paso "Reiniciar Always-on Tasks" para el patron exacto.
# Nunca corre makemigrations (los archivos de migracion se generan y
# revisan siempre en el workspace de Claude antes de pushear, nunca
# en el servidor -- ver com-migrations seccion 1).
#
# NOTA sobre las etiquetas "Beat + Chat + Notificaciones" (Primario) /
# "IA + Generacion" (Pesado) que aparecen en el panel de PythonAnywhere:
# esas etiquetas las puso Gemini al construir la plataforma, no
# reflejan necesariamente el enrutado real de colas. Auditoria real
# contra CELERY_TASK_ROUTES en core/settings.py (2026-07-24): solo
# 'orchestrator.tasks.generate_exam_task' esta enrutada a
# 'high_priority' (Primario) -- todo lo demas (incluidos
# academic_chat/tasks.py, messaging/tasks.py y schedule/tasks.py, pese
# a lo que sugiere la etiqueta "Chat + Notificaciones") cae en la cola
# 'default' por CELERY_TASK_DEFAULT_QUEUE, consumida por el worker
# Pesado. Los patrones de este workflow siguen el enrutado REAL, no
# las etiquetas. No se ha tocado el enrutado de colas en si -- es una
# discrepancia solo de etiquetado, dejada anotada aqui.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar clave SSH dedicada
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_SSH_PRIVATE_KEY }}" > ~/.ssh/pa_deploy_key
          chmod 600 ~/.ssh/pa_deploy_key
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: git pull + migrate + collectstatic en PythonAnywhere
        id: deploy
        # set -o pipefail en el shell EXTERIOR de la Action (no basta
        # con el `set -e` de dentro del script remoto de ssh) -- misma
        # correccion que EnterpriseBot aplico tras su incidente S014,
        # aplicada aqui desde el primer commit para no repetirlo.
        run: |
          set -o pipefail
          ssh -i ~/.ssh/pa_deploy_key MiguelAeTxio@ssh.pythonanywhere.com '
            set -e
            cd /home/MiguelAeTxio/PROJECTS/CampuStudiOnline
            OLD_HEAD=$(git rev-parse HEAD)
            echo "--- git fetch + reset --hard origin/main ---"
            # Nunca "git pull" (merge): el checkout de despliegue debe
            # alinearse siempre exactamente con origin/main, nunca
            # fusionar. Imprescindible ademas tras la reescritura de
            # historial de 2026-07-24 (git filter-repo, incidente de
            # credenciales expuestas) -- el checkout previo del
            # servidor tenia la historia antigua, con hashes de commit
            # distintos a los nuevos, y un "git pull" normal fallaba
            # con "refusing to merge unrelated histories" (visto en
            # vivo, primera ejecucion real de este workflow).
            git fetch origin main
            git reset --hard origin/main
            NEW_HEAD=$(git rev-parse HEAD)
            source /home/MiguelAeTxio/.virtualenvs/campus_pa_env_py3.10/bin/activate
            echo "--- migrate ---"
            python -m dotenv run python manage.py migrate --noinput
            echo "--- collectstatic ---"
            # Sin --clear a proposito (2026-07-27). --clear vacia
            # STATIC_ROOT antes de regenerar: si algo falla despues, el
            # sitio queda sin staticfiles.json y, con
            # ManifestStaticFilesStorage, cada {% static %} lanza
            # ValueError "Missing staticfiles manifest entry" -- es
            # decir, 500 en TODAS las paginas a la vez. Incidente real
            # de ese dia: caida total del sitio mientras este mismo
            # paso reportaba exito.
            python -m dotenv run python manage.py collectstatic --noinput
            echo "--- verificacion del manifiesto (barrera dura) ---"
            if [ ! -s staticfiles_production/staticfiles.json ]; then
              echo "ERROR: staticfiles.json ausente o vacio tras collectstatic."
              echo "Abortando el despliegue: recargar ahora dejaria el sitio con 500 en todas las paginas."
              exit 1
            fi
            echo "staticfiles.json presente: $(wc -c < staticfiles_production/staticfiles.json) bytes"
            echo "--- verificacion de archivos estaticos nuevos/modificados en el manifiesto ---"
            # [FIX S029] Defecto real encontrado en produccion: collectstatic
            # completo sin ningun error (exit 0, staticfiles.json no vacio),
            # pero un archivo estatico nuevo (static/vendor/wanakana/
            # wanakana.min.js) no quedo con entrada en el manifiesto tras
            # esa pasada -- 500 real en cualquier pagina que lo referenciara
            # via {% static %} (ManifestStaticFilesStorage exige la entrada).
            # Quirk conocido de Django: a veces hace falta una segunda pasada
            # de collectstatic para que el post-procesado resuelva todas las
            # entradas. Se reintenta una vez antes de fallar duro.
            NEW_STATIC_FILES=$(git diff --name-only --diff-filter=ACM "$OLD_HEAD" "$NEW_HEAD" -- static/ | sed "s|^static/||")
            check_static_manifest() {
              MISSING=""
              for f in $NEW_STATIC_FILES; do
                if ! grep -qF "\"$f\"" staticfiles_production/staticfiles.json; then
                  MISSING="$MISSING $f"
                fi
              done
              echo "$MISSING"
            }
            if [ -n "$NEW_STATIC_FILES" ]; then
              MISSING=$(check_static_manifest)
              if [ -n "$MISSING" ]; then
                echo "Faltan en el manifiesto tras la primera pasada:$MISSING"
                echo "--- reintentando collectstatic (segunda pasada) ---"
                python -m dotenv run python manage.py collectstatic --noinput
                MISSING=$(check_static_manifest)
              fi
              if [ -n "$MISSING" ]; then
                echo "ERROR: siguen faltando en el manifiesto tras dos pasadas:$MISSING"
                echo "Abortando el despliegue: recargar ahora dejaria 500 en cualquier pagina que use estos archivos."
                exit 1
              fi
              echo "Todos los archivos estaticos nuevos/modificados confirmados en el manifiesto:$NEW_STATIC_FILES"
            else
              echo "Sin archivos estaticos nuevos/modificados en este push."
            fi
            echo "--- CHANGED_FILES_START ---"
            git diff --name-only "$OLD_HEAD" "$NEW_HEAD"
            echo "--- CHANGED_FILES_END ---"
          ' | tee /tmp/deploy_output.txt

      - name: Recargar la web app (API PythonAnywhere)
        if: success()
        run: |
          # [2026-07-27] Antes: curl -sf, que abortaba el paso sin dejar rastro
          # del motivo. Los logs de Actions viven en un host de Azure
          # (productionresultssa*) que NO es alcanzable desde el workspace del
          # modelo, asi que tres fallos seguidos de este paso fueron
          # indiagnosticables. Ahora se captura el codigo HTTP y el cuerpo, se
          # imprimen, y ademas se dejan en el servidor para poder leerlos por
          # sftp como cualquier otro artefacto (ver com-file-request).
          HTTP=$(curl -s -o /tmp/reload_body.txt -w '%{http_code}' --max-time 60 -X POST \
            "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/webapps/www.campustudionline.com/reload/" \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}")
          echo "--- Reload: HTTP $HTTP ---"
          head -c 500 /tmp/reload_body.txt || true
          echo ""
          BODY=$(head -c 300 /tmp/reload_body.txt | tr -d '\n' | tr -d "'")
          ssh -i ~/.ssh/pa_deploy_key MiguelAeTxio@ssh.pythonanywhere.com \
            "echo \"\$(date -u +'%Y-%m-%d %H:%M:%S') | commit ${{ github.sha }} | reload HTTP $HTTP | $BODY\" >> /home/MiguelAeTxio/SWAP/deploy_reload_history.txt" || true
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "ERROR: la recarga de la web app devolvio HTTP $HTTP"
            exit 1
          fi
          echo "--- Reload solicitado OK ---"

      - name: Reiniciar Always-on Tasks si el push las afecta
        # IDs reales de las Always-on Tasks de CampuStudiOnline
        # (confirmados por Miguel Angel via URL de log, 2026-07-24):
        #   182748 -- Primario: worker high_priority (hp_worker) + Beat
        #   209547 -- Pesado: worker default,content_automation (heavy_worker)
        #
        # Patrones derivados de la auditoria real de tasks.py y de
        # CELERY_TASK_ROUTES (core/settings.py), no de las etiquetas
        # del panel -- ver nota al inicio de este archivo.
        # [2026-07-27] Antes: if: success(), lo que ataba el reinicio de los
        # workers al exito de la recarga de la web app. Son cosas
        # independientes: Celery no se entera de un reload de uWSGI, y un
        # fallo de la API de recarga dejaba a los workers ejecutando codigo
        # viejo indefinidamente y en silencio. Ocurrio tres despliegues
        # seguidos el 2026-07-27 (ff562bb, 7504fd9, 5c78a00). Ahora depende
        # solo de que el codigo haya llegado al servidor.
        # [2026-07-28] La condicion llevaba solo "steps.deploy.outcome ==
        # 'success'". No basta: cuando una condicion if: no incluye una funcion
        # de estado, GitHub le antepone un success() implicito, de modo que el
        # paso seguia atado al exito del paso ANTERIOR (la recarga web). Es
        # decir, el desacople que describe el comentario de arriba nunca llego a
        # ser efectivo. Ocurrio en vivo el 2026-07-28 (commit aa9cda2): la
        # recarga fallo, este paso salio "skipped" y los dos workers se quedaron
        # ejecutando codigo viejo, que es exactamente el escenario que el cambio
        # del 2026-07-27 pretendia evitar. Con always() la condicion pasa a
        # depender solo de que el codigo haya llegado al servidor.
        if: always() && steps.deploy.outcome == 'success'
        run: |
          set -o pipefail
          CHANGED=$(sed -n '/--- CHANGED_FILES_START ---/,/--- CHANGED_FILES_END ---/p' /tmp/deploy_output.txt | sed '1d;$d')
          {
            echo "Archivos cambiados en este despliegue:"
            echo "$CHANGED"
            echo ""

            if echo "$CHANGED" | grep -qE '^(orchestrator/tasks\.py|orchestrator/models\.py|orchestrator/signals\.py|core/celery\.py|core/settings\.py|core/services/gemini_service\.py|core/services/gemini_schemas\.py|core/services/prompt_generators\.py|assessment_v2/|academic_structure/models\.py|users/models\.py|contents/models\.py|contents/services/navigation_builder\.py|messaging/push_utils\.py|media_library/)'; then
              echo "--- Primario: cambios relevantes detectados, reiniciando (id 182748) ---"
              curl -sf --max-time 60 -X POST "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/always_on/182748/restart/" \
                -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}"
              echo ""
              echo "Primario: reinicio solicitado OK."
            else
              echo "Primario: sin cambios relevantes, no se reinicia."
            fi

            if echo "$CHANGED" | grep -qE '^(orchestrator/|content_automation/|academic_chat/tasks\.py|academic_chat/models\.py|messaging/tasks\.py|messaging/push_utils\.py|schedule/tasks\.py|schedule/models\.py|users/tasks\.py|assessment_v2/|core/celery\.py|core/settings\.py|core/services/|academic_structure/models\.py|contents/models\.py|contents/services/navigation_builder\.py)'; then
              echo "--- Pesado: cambios relevantes detectados, reiniciando (id 209547) ---"
              curl -sf --max-time 60 -X POST "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/always_on/209547/restart/" \
                -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}"
              echo ""
              echo "Pesado: reinicio solicitado OK."
            else
              echo "Pesado: sin cambios relevantes, no se reinicia."
            fi
          } | tee /tmp/restart_output.txt

      - name: Resumen del despliegue (mantener informado a Miguel Angel)
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Despliegue CampuStudiOnline -- $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Mensaje (primera linea):** $(printf '%s' "$COMMIT_MESSAGE" | head -1)"
            echo ""
            echo "### Salida del servidor"
            echo '```'
            cat /tmp/deploy_output.txt 2>/dev/null || echo "(sin salida capturada -- revisar el paso anterior)"
            echo '```'
            if grep -q "No migrations to apply" /tmp/deploy_output.txt 2>/dev/null; then
              echo ""
              echo "Sin migraciones nuevas aplicadas en este despliegue."
            else
              echo ""
              echo "**Atencion: puede haberse aplicado una migracion nueva -- revisar la salida de arriba.**"
            fi
            echo ""
            echo "### Always-on Tasks (Primario / Pesado)"
            echo '```'
            cat /tmp/restart_output.txt 2>/dev/null || echo "(sin ejecutar -- revisar el paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/pa_deploy_key
